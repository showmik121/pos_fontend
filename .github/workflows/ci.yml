name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: ফ্রন্টএন্ডের স্ট্যাটিক ফাইল সংরক্ষণ
        uses: actions/upload-artifact@v4
        with:
          name: pos-frontend-out
          path: out
          retention-days: 7
